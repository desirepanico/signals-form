<main class="flex min-h-screen items-center justify-center bg-slate-100 p-4">
  <form [formRoot]="form" class="w-full max-w-md space-y-5 rounded-2xl bg-white p-8 shadow-lg">
    <h1 class="text-2xl font-semibold text-slate-900">Registrazione</h1>

    <app-input-text label="registration.fields.username" [field]="form.username" />
    <app-input-text label="registration.fields.email" type="email" [field]="form.email" />
    <app-input-text label="registration.fields.password" type="password" [field]="form.password" />
    <app-input-text
      label="registration.fields.confirmPassword"
      type="password"
      [field]="form.confirmPassword"
    />
    <app-input-text label="registration.fields.phone" type="tel" [field]="form.phone" />
    <app-input-text label="registration.fields.website" type="url" [field]="form.website" />
    <app-input-text label="registration.fields.age" type="number" [field]="form.age" />
    <app-input-text label="registration.fields.birthDate" type="date" [field]="form.birthDate" />

    <fieldset class="space-y-3">
      <legend class="text-sm font-semibold text-slate-900">Tipo di cliente</legend>
      <div class="flex gap-2">
        @for (option of ['private', 'company']; track option) {
          <button
            type="button"
            (click)="setCustomerType($any(option))"
            [attr.aria-pressed]="customerType() === option"
            class="flex-1 rounded-lg border px-3 py-2 text-sm font-medium transition"
            [class]="
              customerType() === option
                ? 'border-indigo-600 bg-indigo-50 text-indigo-700'
                : 'border-slate-300 text-slate-600 hover:bg-slate-50'
            "
          >
            {{ option === 'private' ? 'Privato' : 'Azienda' }}
          </button>
        }
      </div>
      @if (customerType() === 'private') {
        <app-input-text label="registration.fields.fiscalCode" [field]="privateCustomer.fiscalCode" />
      } @else {
        <app-input-text label="registration.fields.vatNumber" [field]="companyCustomer.vatNumber" />
      }
    </fieldset>

    <app-input-checkbox label="registration.fields.applyDiscount" [field]="form.applyDiscount" />
    @if (!form.promoCode().hidden()) {
      <app-input-text label="registration.fields.promoCode" [field]="form.promoCode" />
    }

    <fieldset class="space-y-3">
      <legend class="text-sm font-semibold text-slate-900">Articoli</legend>
      @for (item of form.items; track $index; let i = $index) {
        <div class="flex items-start gap-2">
          <app-input-text class="flex-1" label="registration.fields.itemName" [field]="item.name" />
          <app-input-text
            class="w-24"
            label="registration.fields.itemQuantity"
            type="number"
            [field]="item.quantity"
          />
          <button
            type="button"
            (click)="removeItem(i)"
            class="mt-7 rounded-lg px-2 py-2 text-sm text-red-600 hover:bg-red-50"
          >
            ✕
          </button>
        </div>
      }
      <button
        type="button"
        (click)="addItem()"
        class="text-sm font-medium text-indigo-600 hover:text-indigo-700"
      >
        + Aggiungi articolo
      </button>
    </fieldset>

    <button
      type="submit"
      [disabled]="form().invalid() || form().pending()"
      class="w-full rounded-lg bg-indigo-600 px-4 py-2 font-medium text-white transition hover:bg-indigo-700 disabled:cursor-not-allowed disabled:opacity-50"
    >
      Registrati
    </button>
    <p class="text-center text-sm text-slate-500">
      Hai già un account?
      <a routerLink="/login" class="font-medium text-indigo-600 hover:text-indigo-700">Accedi</a>
    </p>
  </form>
</main>
