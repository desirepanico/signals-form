<main class="flex min-h-screen items-center justify-center bg-slate-100 p-4">
  <form [formRoot]="form" class="w-full max-w-sm space-y-5 rounded-2xl bg-white p-8 shadow-lg">
    <h1 class="text-2xl font-semibold text-slate-900">Accedi</h1>

    <app-input-text label="login.fields.email" type="email" [field]="form.email" />
    <app-input-text label="login.fields.password" type="password" [field]="form.password" />

    <button
      type="submit"
      [disabled]="form().invalid() || form().submitting()"
      class="w-full rounded-lg bg-indigo-600 px-4 py-2 font-medium text-white transition hover:bg-indigo-700 disabled:cursor-not-allowed disabled:opacity-50"
    >
      {{ form().submitting() ? 'Accesso in corso…' : 'Accedi' }}
    </button>

    <p class="text-center text-sm text-slate-500">
      Non hai un account?
      <a routerLink="/register" class="font-medium text-indigo-600 hover:text-indigo-700">
        Registrati
      </a>
    </p>
    <p class="text-center text-xs text-slate-400">Demo: demo&#64;example.com / password1</p>
  </form>
</main>
