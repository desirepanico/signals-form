<app-field-wrapper
  [label]="label()"
  [disabled]="field()().disabled()"
  [errors]="hasError() ? field()().errors() : []"
>
  <div class="relative">
    <input
      [type]="visible() ? 'text' : 'password'"
      [formField]="field()"
      [class]="inputClass()"
      [attr.autocomplete]="autocomplete()"
    />
    <button
      type="button"
      (click)="toggle()"
      [disabled]="field()().disabled()"
      [attr.aria-label]="toggleLabel()"
      [attr.aria-pressed]="visible()"
      class="absolute inset-y-0 right-0 flex items-center px-3 text-slate-500 hover:text-slate-700 disabled:cursor-not-allowed disabled:text-slate-300"
    >
      @if (visible()) {
        <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.22A10.48 10.48 0 0 0 1.93 12c1.29 4.06 5.1 7 9.57 7 1.99 0 3.84-.59 5.4-1.6M6.23 6.23A9.97 9.97 0 0 1 11.5 5c4.47 0 8.28 2.94 9.57 7a10.5 10.5 0 0 1-4.29 5.28M6.23 6.23 3 3m3.23 3.23 3.65 3.65m7.9 7.9L21 21m-3.23-3.23-3.65-3.65m0 0a3 3 0 1 0-4.24-4.24m4.24 4.24L9.88 9.88" />
        </svg>
      } @else {
        <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M2.04 12.32a1 1 0 0 1 0-.64C3.42 7.51 7.36 4.5 12 4.5s8.58 3.01 9.96 7.18a1 1 0 0 1 0 .64C20.58 16.49 16.64 19.5 12 19.5s-8.58-3.01-9.96-7.18Z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
        </svg>
      }
    </button>
  </div>
</app-field-wrapper>
